name: rgb_sdk_flutter
description: Flutter SDK for Bitcoin, RGB assets, and RGB Lightning wallets backed by RGB Lightning Node.
version: 0.1.0
publish_to: 'none'
homepage: https://github.com/UTEXO-Protocol/flutter-sdk
repository: https://github.com/UTEXO-Protocol/flutter-sdk
issue_tracker: https://github.com/UTEXO-Protocol/flutter-sdk/issues
topics:
  - bitcoin
  - rgb
  - lightning
  - wallet

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  bip32: ^2.0.0
  bip39: ^1.0.6
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  http: ^1.6.0
  meta: ^1.17.0
  pointycastle: ^3.9.1

dev_dependencies:
  analyzer: ^10.0.1
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^26.3.4

flutter:
  plugin:
    platforms:
      android:
        package: com.utexo.rgb_sdk_flutter
        pluginClass: RgbSdkFlutterPlugin
      ios:
        pluginClass: RgbSdkFlutterPlugin
